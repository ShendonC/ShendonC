<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276"
     role="img" aria-label="ShendonC — audiovisual producer, computer science, generative-AI pipelines">
  <title>ShendonC</title>
  <style>
    /* Nenhuma fonte externa: SVG dentro de img roda em "secure animated mode"
       — sem rede, sem script, só animação declarativa. */
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .a { font-size: 16px; fill: #e9edf2; opacity: 0;
          animation: entra .5s cubic-bezier(.16,1,.3,1) forwards; }
    .b { transform-origin: 0 0; transform: scaleX(0);
          animation: varre .5s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes entra { from { opacity: 0; transform: translateX(-9px); }
                        to   { opacity: 1; transform: none; } }
    @keyframes varre { to { transform: scaleX(1); } }
    .p { font-size: 15px; fill: #10B410; }
    .l { font-size: 15px; fill: #9ba7b5; }
    #cortina { animation: digita 2.4s steps(69) .8s forwards; }
    @keyframes digita { to { width: 621px; } }
    .cur { fill: #f5a63c; animation: pisca 1.06s steps(1) infinite; }
    @keyframes pisca { 50% { opacity: 0; } }
    .r { font-size: 11.5px; fill: #566475; letter-spacing: .14em; }
    @media (prefers-reduced-motion: reduce) {
      .a { opacity: 1; animation: none; }
      .b { transform: none; animation: none; }
      #cortina { width: 621px; animation: none; }
      .cur { animation: none; }
    }
  </style>
